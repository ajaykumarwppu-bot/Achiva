name: Build APK

on:
  workflow_dispatch:          # Actions tab se manual run
  push:
    paths:
      - 'android-app/**'      # sirf native code badle par rebuild
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Create signing keystore (first time only)
        run: |
          if [ ! -f android-app/app/achiva.keystore ]; then
            keytool -genkeypair -v -keystore android-app/app/achiva.keystore \
              -alias achiva -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass achiva123 -keypass achiva123 -dname "CN=Achiva"
            echo "KEYSTORE_CREATED=1" >> $GITHUB_ENV
            echo "✔ Naya keystore bana — is run ka artifact zaroor download karna"
          else
            echo "✔ Repo wala keystore use ho raha hai (same signature)"
          fi

      - name: Build debug APK
        run: cd android-app && gradle assembleDebug --no-daemon --stacktrace

      - name: Upload keystore (sirf pehli baar)
        if: env.KEYSTORE_CREATED == '1'
        uses: actions/upload-artifact@v4
        with:
          name: achiva-keystore
          path: android-app/app/achiva.keystore

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: achiva-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
