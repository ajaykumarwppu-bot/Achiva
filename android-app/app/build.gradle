plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'   // ★ Kotlin compile karne ke liye ZAROORI
}

android {
    namespace 'com.achiva.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.achiva.app"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "1.6"

        // ★★ apna GitHub Pages URL (ending slash / ke saath) ★★
        // NOTE: Pages path CASE-SENSITIVE hai — repo 'Achiva' hai, isliye '/Achiva/' (capital A)
        buildConfigField "String", "WEB_URL", "\"https://ajaykumarwppu-bot.github.io/Achiva/\""
        // GOOGLE-FIX (native sign-in): Firebase Console → Authentication →
        // Sign-in method → Google → Web SDK configuration → "Web client ID"
        // (698527829835-xxxx.apps.googleusercontent.com) yahan paste karo.
        // Khaali raha to native account chooser skip hokar purana WebView
        // redirect flow chalega (pehle jaisa).
        // CI / local build mein -PgoogleWebClientId se bhi de sakte ho:
        //   gradle assembleDebug -PgoogleWebClientId=YOUR_WEB_CLIENT_ID
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\""+ (project.findProperty("googleWebClientId") ?: "") + "\""
    }

    buildFeatures {
        buildConfig true
    }

    // ★ permanent signing key : har APK same signature se banega
    //   → purana app delete kiye bina UPDATE install hoga, data safe
    signingConfigs {
        achiva {
            storeFile file("achiva.keystore")
            storePassword "achiva123"
            keyAlias "achiva"
            keyPassword "achiva123"
        }
    }

    buildTypes {
        debug {
            if (file("achiva.keystore").exists()) {
                signingConfig signingConfigs.achiva
            }
        }
        release {
            minifyEnabled false
            if (file("achiva.keystore").exists()) {
                signingConfig signingConfigs.achiva
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // GOOGLE-FIX (native sign-in): phone ke system Google accounts dikhane ke liye.
    // Credential Manager = system account chooser (laptop jaisa).
    // androidx.browser = Custom Tab fallback (Chrome cookies share karta hai).
    // play-services-auth = Google ID token (Firebase signInWithCredential ke liye).
    // Use published Credential Manager artifacts and the Google ID library used by GoogleAuth.kt.
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.browser:browser:1.8.0'
}
